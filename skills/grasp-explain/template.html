<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>grasp · explain</title>
<!-- grasp-explain renderer. build.mjs puts the tour data in the script#tour placeholder below. This file lives under ~/.grasp, never in the repo. -->
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --ink:#1b1f24; --muted:#5b6470; --rule:#dde1e6;
    --accent:#2f6fde; --code-bg:#f0f2f5;
    --add:#1a7f37; --add-bg:#e6f4ea; --del:#b42318; --del-bg:#fdecea; --hunk:#6e56cf;
    --you:#8a4b00; --you-bg:#fff0d6;
    --low:#1a7f37; --med:#9a6700; --high:#b42318;
    --gut:#8c959f; --lit:#2f6fde0d; --sweep:#2f6fde30; --hl:#2f6fde24; --dim:.42;
    --kw:#cf222e; --str:#0a3069; --num:#0550ae; --com:#6e7781; --fn:#8250df; --ty:#953800;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0f1216; --card:#161a20; --ink:#e6e9ee; --muted:#9aa4b1; --rule:#2a313a;
      --accent:#7aa7ff; --code-bg:#1b2027;
      --add:#56d364; --add-bg:#12261a; --del:#ff7b72; --del-bg:#2d1416; --hunk:#b3a4ff;
      --you:#ffb454; --you-bg:#33240d;
      --low:#56d364; --med:#e3b341; --high:#ff7b72;
      --gut:#6e7681; --lit:#7aa7ff0f; --sweep:#7aa7ff30; --hl:#7aa7ff26; --dim:.4;
      --kw:#ff7b72; --str:#a5d6ff; --num:#79c0ff; --com:#8b949e; --fn:#d2a8ff; --ty:#ffa657;
      color-scheme:dark;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:1360px;margin:0 auto;padding:20px 24px 32px}
  code,kbd,.mono,.code,.tabs,.chip,.arrow,.pill,.badge,.eyebrow,h3{font-family:ui-monospace,"Cascadia Code","SF Mono",Consolas,monospace;font-variant-ligatures:none}
  button{font:inherit;color:inherit;cursor:pointer}
  .eyebrow,h3{font-size:11px;line-height:1.2;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}

  /* header */
  header{display:grid;gap:4px;margin-bottom:14px}
  .titlerow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
  h1{font-size:22px;line-height:1.25;margin:0;text-wrap:balance}
  .meta{color:var(--muted);font-size:13px;margin:0}
  .meta code{color:var(--ink)}
  .risk{display:inline-flex;align-items:baseline;gap:7px;font-size:12.5px;padding:2px 10px;border-radius:999px;border:1px solid currentColor}
  .risk b{font:700 10.5px/1 ui-monospace,Consolas,monospace;text-transform:uppercase;letter-spacing:.06em}
  .risk.low{color:var(--low)} .risk.med{color:var(--med)} .risk.high{color:var(--high)}
  .ww{display:grid;grid-template-columns:max-content 1fr;gap:2px 14px;margin:8px 0 0}
  .ww dt{font:600 11px/23px ui-monospace,Consolas,monospace;letter-spacing:.08em;color:var(--muted)}
  .ww dd{margin:0;font-size:15px}

  /* path strip: chips coloured by change status, a lit token on the active one */
  .strip{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:6px 0;padding:7px;background:var(--card);border:1px solid var(--rule);border-radius:10px;margin-bottom:14px}
  .token{position:absolute;left:0;top:0;border-radius:7px;background:var(--hl);box-shadow:inset 0 0 0 1.5px var(--accent);pointer-events:none}
  .token.ready{transition:transform .38s cubic-bezier(.3,.7,.2,1),width .38s,height .38s}
  .chip{position:relative;display:inline-flex;align-items:center;gap:7px;padding:5px 10px 5px 6px;border:0;background:none;border-radius:7px;font-size:12.5px;color:var(--muted)}
  .chip:hover,.chip[aria-current]{color:var(--ink)}
  .chip .n{display:grid;place-items:center;min-width:20px;height:20px;border-radius:5px;font-size:11px;font-weight:700;color:var(--st);background:color-mix(in srgb,var(--st) 16%,transparent)}
  .new{--st:var(--add)} .changed{--st:var(--med)} .context{--st:var(--muted)}
  .arrow{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:30px;max-width:180px;padding:0 4px;font-size:10.5px;color:var(--muted)}
  .arrow span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .arrow i{align-self:stretch;position:relative;height:1px;margin-right:4px;background:var(--gut)}
  .arrow i::after{content:"";position:absolute;right:-5px;top:-3.5px;border:4px solid transparent;border-left:6px solid var(--gut);border-right:0}
  .legend{margin-left:auto;display:flex;gap:12px;padding:0 6px;font-size:11.5px;color:var(--muted)}
  .legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:var(--st)}

  /* stage */
  .stage{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
  #editor{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--rule);border-radius:10px}
  .ed{animation:in .32s ease-out}
  .ed.out{position:absolute;inset:0 0 auto;animation:out .32s ease-in forwards;pointer-events:none}
  @keyframes in{from{opacity:0}} @keyframes out{to{opacity:0}}
  .tabs{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;padding-right:10px;background:var(--code-bg);border-bottom:1px solid var(--rule);font-size:12.5px}
  .tab{display:flex;gap:10px;align-items:baseline;padding:7px 14px 8px;margin-bottom:-1px;background:var(--card);border-top:2px solid var(--accent);border-right:1px solid var(--rule);font-weight:600}
  .tab .dir,.tab .range{color:var(--muted);font-weight:400}
  .tabs .open{margin-left:auto;font-size:11.5px;color:var(--accent);text-decoration:none;padding:4px 0}
  .tabs .open:hover{text-decoration:underline}
  .badge{display:inline-block;font-size:10.5px;line-height:1;font-weight:700;padding:4px 7px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em;color:var(--st,var(--muted));background:color-mix(in srgb,var(--st,var(--muted)) 15%,transparent)}
  .badge.you{--st:var(--you);background:var(--you-bg);text-transform:none;letter-spacing:0}
  .badge.lock{--st:var(--accent)} .badge.unconfirmed{--st:var(--del)}

  /* code */
  .code{position:relative;overflow:auto;max-height:max(340px,calc(100vh - 300px));padding:6px 0 10px;font-size:13px;line-height:20px;tab-size:4}
  .lines{width:max-content;min-width:100%}
  .row{display:flex;position:relative;white-space:pre}
  .gut{position:sticky;left:0;z-index:2;flex:none;width:54px;padding-right:16px;text-align:right;color:var(--gut);background:var(--card);user-select:none}
  .src{flex:1;padding-right:28px}
  .row.dim .src{opacity:var(--dim)}
  .row.focus{background:linear-gradient(90deg,transparent,var(--sweep),transparent) -60% 0/35% 100% no-repeat var(--lit);animation:sweep .7s .12s ease-out both}
  .row.focus .gut{color:var(--ink)}
  .lit{background:var(--lit)}
  .row.focus .gut,.lit .gut{background:linear-gradient(var(--lit),var(--lit)),var(--card);box-shadow:inset 2px 0 var(--accent)}
  @keyframes sweep{from{background-position:-60% 0}to{background-position:160% 0}}
  .row.add .gut::after{content:"";position:absolute;right:6px;top:0;bottom:0;width:3px;background:var(--add)}
  .lines .row.hl{background-color:var(--hl)}
  .lines .row.hl .src{opacity:1}
  .com{color:var(--com);font-style:italic} .str{color:var(--str)} .num{color:var(--num)} .kw{color:var(--kw)} .fn{color:var(--fn)} .ty{color:var(--ty)}

  /* decorations: in/out marker rules, note callouts, removed lines */
  .mk{--mk:var(--gut);display:flex;height:24px}
  .mk.strong{--mk:var(--accent)}
  .mk .rule{flex:1;position:relative;display:flex;align-items:center}
  .mk .rule::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed var(--mk);transform-origin:left;animation:draw .45s ease-out both}
  .mk.strong .rule::before{border-top:2px solid var(--mk);margin-top:-1px}
  @keyframes draw{from{transform:scaleX(0)}}
  .pill{position:sticky;left:62px;z-index:1;display:inline-flex;align-items:baseline;gap:7px;margin-left:8px;padding:0 9px;border-radius:999px;border:1px solid var(--mk);background:var(--card);color:var(--ink);font-size:11.5px;line-height:18px}
  .pill b{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--mk)}
  .mk.strong .pill{background:var(--accent);color:var(--card)}
  .mk.strong .pill b{color:inherit}
  .row.note{white-space:normal}
  .callout{position:sticky;left:62px;display:inline-flex;align-items:center;gap:8px;max-width:min(64ch,calc(100vw - 120px));margin:1px 0 5px 8px;padding:2px 10px 2px 3px;border-radius:6px;background:color-mix(in srgb,var(--accent) 11%,var(--card));font:12.5px/18px system-ui,-apple-system,"Segoe UI",sans-serif}
  .callout::before{content:"";position:absolute;left:8px;top:-5px;border:5px solid transparent;border-bottom-color:color-mix(in srgb,var(--accent) 11%,var(--card));border-top:0}
  .pin{display:grid;place-items:center;flex:none;width:17px;height:17px;border-radius:50%;background:var(--accent);color:var(--card);font:700 10px/1 ui-monospace,Consolas,monospace}
  .row.rm .gut::after{content:"";position:absolute;right:4px;top:6px;border:4px solid transparent;border-left:6px solid var(--del);border-right:0}
  .rmbtn{position:sticky;left:62px;margin-left:4px;padding:0 6px;border:0;border-radius:4px;background:none;color:var(--del);font-size:11.5px}
  .rmbtn:hover{background:var(--del-bg)}
  .rmbtn::after{content:" ▸"} .rmbtn[aria-expanded="true"]::after{content:" ▾"}
  .row.del,.row.del .gut{background:var(--del-bg);color:var(--del)}

  /* narration */
  .narr{position:sticky;top:12px;background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:12px 16px 16px}
  .ctl{display:flex;align-items:center;gap:8px;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--rule)}
  .nb{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--rule);border-radius:7px;background:var(--bg);font-size:13px}
  .nb:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .nb:disabled{opacity:.4;cursor:default}
  kbd{font-size:11px;color:var(--muted)}
  .dots{flex:1;display:flex;justify-content:center;gap:5px}
  .dot{width:8px;height:8px;padding:0;border:0;border-radius:4px;background:var(--rule);transition:width .3s}
  .dot.on{width:20px;background:var(--accent)}
  .role.entry,.role.exit{color:var(--accent)}
  .narr h2{font-size:18px;line-height:1.3;margin:6px 0 2px}
  .at{font-size:12.5px;color:var(--muted)}
  .say{font-size:15px;line-height:1.55;margin:10px 0 0}
  .notes{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:2px}
  .notes li{display:flex;align-items:baseline;gap:8px;padding:4px 6px;margin:0 -6px;border-radius:6px;font-size:13.5px;cursor:default}
  .notes li:hover{background:var(--hl)}
  .notes .pin{transform:translateY(3px)}
  .notes .ln{margin-left:auto;font:11px ui-monospace,Consolas,monospace;color:var(--muted)}
  .dec{margin-top:14px;border:1px solid var(--rule);border-radius:8px}
  .dchip{display:flex;width:100%;align-items:baseline;gap:8px;padding:7px 10px;border:0;background:none;text-align:left;font-size:13.5px}
  .dchip code{font-weight:700;color:var(--accent)}
  .dchip::after{content:"▸";margin-left:auto;color:var(--muted)} .dchip[aria-expanded="true"]::after{content:"▾"}
  .dbody{padding:0 10px 10px}
  .dbody dl{display:grid;grid-template-columns:max-content 1fr;gap:3px 12px;margin:0 0 8px;font-size:13.5px}
  .dbody dt{font:11px/20px ui-monospace,Consolas,monospace;color:var(--muted)}
  .dbody dd{margin:0}
  .badges{display:inline-flex;flex-wrap:wrap;gap:4px}

  /* cards */
  .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
  .card{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:12px 16px}
  .card.wide{grid-column:1/-1}
  .card h3 span{font-weight:400;letter-spacing:0;text-transform:none}
  .card ul{list-style:none;margin:8px 0 0;padding:0}
  .card li,.drow{padding:6px 0;border-top:1px solid var(--rule)}
  .card li:first-child,.drow:first-of-type{border-top:0}
  .drow{display:grid;grid-template-columns:30px minmax(0,.8fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.3fr) 240px;gap:12px;align-items:baseline;font-size:13.5px}
  .drow.cur{margin:0 -16px;padding-left:16px;padding-right:16px;background:var(--lit);box-shadow:inset 2px 0 var(--accent)}
  .drow code{font-weight:700;color:var(--accent)}
  .lbl{font:11px ui-monospace,Consolas,monospace;color:var(--muted);margin-right:6px}
  .risks li{font-size:13.5px}
  .tag{display:inline-block;margin:3px 6px 0 0;font:700 10px/1 ui-monospace,Consolas,monospace;text-transform:uppercase;letter-spacing:.05em;padding:3px 6px;border-radius:4px;color:var(--st);background:color-mix(in srgb,var(--st) 15%,transparent)}
  .tag.ok{--st:var(--low)} .tag.gap{--st:var(--med)}
  .tagtext{font-size:12.5px;color:var(--muted);margin-right:12px}
  .off li{display:grid;grid-template-columns:minmax(0,max-content) minmax(0,1fr) max-content;gap:12px;align-items:baseline;font-size:13px}
  .off code{font-size:12.5px;overflow-wrap:anywhere}
  .off .what{color:var(--muted)}
  .stat{font:12px ui-monospace,Consolas,monospace} .stat .a{color:var(--add)} .stat .d{color:var(--del)}
  footer{margin-top:18px;text-align:center;font-size:12px;color:var(--muted)}

  @media (max-width:900px){
    main{padding:16px}
    .stage,.cards{grid-template-columns:minmax(0,1fr)}
    .narr{position:static}
    .code{max-height:none}
    .legend{display:none}
    .drow{grid-template-columns:30px minmax(0,1fr);gap:2px 12px}
    .drow>:nth-child(n+3){grid-column:2}
  }
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">grasp · explain</div>
    <div class="titlerow"><h1 id="title"></h1><span id="risk" class="risk"></span></div>
    <p class="meta" id="meta"></p>
    <dl class="ww"><dt>WHAT</dt><dd id="what"></dd><dt>WHY</dt><dd id="why"></dd></dl>
  </header>
  <nav class="strip" id="strip" aria-label="Path from entry to exit"></nav>
  <div class="stage">
    <section id="editor" aria-label="Code"></section>
    <aside class="narr">
      <div class="ctl">
        <button class="nb" id="prev" title="Previous stop (←)"><kbd>←</kbd>Prev</button>
        <span class="dots" id="dots"></span>
        <button class="nb" id="next" title="Next stop (→)">Next<kbd>→</kbd></button>
      </div>
      <div id="story" aria-live="polite"></div>
    </aside>
  </div>
  <div class="cards">
    <section class="card wide" id="decisions"></section>
    <section class="card risks" id="risks"></section>
    <section class="card off" id="off"></section>
  </div>
  <footer id="foot"></footer>
</main>
<script id="tour" type="application/json">__TOUR__</script>
<script>
(function () {
  var T = JSON.parse(document.getElementById('tour').textContent);
  var S = T.stops, DEC = {}, cur = -1;
  (T.decisions || []).forEach(function (d) { DEC[d.id] = d; });
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var STATUS = { new: 'NEW', changed: 'CHANGED', context: 'CONTEXT' };

  // Tiny editor-style tokenizer: comments, strings, numbers, keywords, calls, types.
  var KW = {};
  ('abstract and as assert async await break case catch class const continue def default defer del delete do elif else enum except export extends ' +
   'false False final finally fn for from func function go if impl import in instanceof interface is lambda let match mod module mut new nil None ' +
   'not null or package pass private protected pub public raise readonly return self Self static struct super switch this throw throws trait true ' +
   'True try type typeof undefined unless use val var void when where while with yield').split(' ').forEach(function (k) { KW[k] = 1; });
  var TOKEN = function (hash) {
    return new RegExp((hash ? '(#.*)' : '(\\/\\/.*|\\/\\*.*?(?:\\*\\/|$))') +
      '|("(?:\\\\.|[^"\\\\])*"?|\'(?:\\\\.|[^\'\\\\])*\'?|`(?:\\\\.|[^`\\\\])*`?)|(\\b(?:0x[\\da-fA-F]+|\\d[\\d_]*(?:\\.\\d+)?)\\b)|([A-Za-z_$][\\w$]*)', 'g');
  };
  function paint(line, st) {
    var out = '', last = 0, m, re = st.re;
    if (st.block) {
      var e = line.indexOf('*/');
      if (e < 0) return '<span class="com">' + esc(line) + '</span>';
      out = '<span class="com">' + esc(line.slice(0, e + 2)) + '</span>'; last = e + 2; st.block = false;
    }
    re.lastIndex = last;
    while ((m = re.exec(line))) {
      var t = m[0], cls = m[1] ? 'com' : m[2] ? 'str' : m[3] ? 'num' : KW[t] ? 'kw'
        : /^\s*\(/.test(line.slice(re.lastIndex)) ? 'fn' : /^[A-Z][a-z]/.test(t) ? 'ty' : '';
      if (m[1] && t.slice(0, 2) === '/*' && (t.length < 4 || t.slice(-2) !== '*/')) st.block = true;
      out += esc(line.slice(last, m.index)) + (cls ? '<span class="' + cls + '">' + esc(t) + '</span>' : esc(t));
      last = re.lastIndex;
    }
    return out + esc(line.slice(last));
  }

  function badges(d) {
    return (d.locked ? '<span class="badge lock">locked</span>' : '') +
      (d.by === 'agent' || d.by === 'agent-approved' ? '<span class="badge">agent</span>' : '') +
      (d.unconfirmed ? '<span class="badge unconfirmed">unconfirmed</span>' : '');
  }
  function marker(kind, m, tag, lit) {
    return '<div class="mk ' + kind + (tag ? ' strong' : '') + lit + '"><span class="gut"></span><span class="rule"><span class="pill"><b>' +
      (tag || kind) + '</b>' + esc(m.label) + '</span></span></div>';
  }

  function editor(s) {
    var a = s.lines[0], b = s.lines[1], fa = s.focus[0], fb = s.focus[1], rows = '', n;
    var added = {}, removed = {}, st = { block: false, re: TOKEN(/\.(py|rb|sh|ya?ml|toml|r|pl|ps1|exs?)$|(^|\/)(Dockerfile|Makefile)$/i.test(s.file)) };
    (s.added || []).forEach(function (k) { added[k] = 1; });
    (s.removed || []).forEach(function (r) { removed[r.before] = r.lines; });
    for (n = a; n <= b + 1; n++) {
      // Decoration rows between two focus lines stay lit: above line n when n > fa, below it when n < fb.
      var gone = removed[n], pre = n > fa && n <= fb ? ' lit' : '', post = n >= fa && n < fb ? ' lit' : '';
      if (gone) rows += '<div class="row rm' + pre + '"><span class="gut"></span><button class="rmbtn" aria-expanded="false">− ' + gone.length + ' line' + (gone.length > 1 ? 's' : '') +
        ' removed</button></div><div hidden>' + gone.map(function (l) { return '<div class="row del"><span class="gut">−</span><span class="src">' + (esc(l) || ' ') + '</span></div>'; }).join('') + '</div>';
      if (n > b) break;
      if (s.in && s.in.line === n) rows += marker('in', s.in, s.role === 'entry' && 'entry', pre);
      rows += '<div class="row' + (added[n] ? ' add' : '') + (n >= fa && n <= fb ? ' focus' : ' dim') + '" data-line="' + n + '"><span class="gut">' + n +
        '</span><span class="src">' + (paint(s.code[n - a] || '', st) || ' ') + '</span></div>';
      (s.notes || []).forEach(function (t, k) {
        if (t.line === n) rows += '<div class="row note' + post + '" data-line="' + n + '"><span class="gut"></span><span class="callout"><span class="pin">' + (k + 1) + '</span>' + esc(t.text) + '</span></div>';
      });
      if (s.out && s.out.line === n) rows += marker('out', s.out, s.role === 'exit' && 'exit', post);
    }
    var dir = s.file.replace(/[^\/]*$/, '');
    return '<div class="tabs"><span class="tab"><span><span class="dir">' + esc(dir) + '</span>' + esc(s.file.slice(dir.length)) + '</span><span class="range">' + a + '–' + b + '</span></span>' +
      '<span class="badge ' + s.status + '">' + STATUS[s.status] + '</span>' +
      (s.yours ? '<span class="badge you">you wrote this · ' + esc(s.yours) + '</span>' : '') +
      (s.open ? '<a class="open" href="' + esc(s.open) + '">Open in editor ↗</a>' : '') +
      '</div><div class="code"><div class="lines">' + rows + '</div></div>';
  }

  function story(s, i) {
    var d = DEC[s.decision];
    return '<div class="eyebrow">Stop ' + (i + 1) + ' of ' + S.length + ' · <span class="role ' + s.role + '">' + s.role + '</span></div>' +
      '<h2>' + esc(s.title) + '</h2><code class="at">' + esc(s.at) + '</code><p class="say">' + esc(s.say) + '</p>' +
      (s.notes && s.notes.length ? '<ol class="notes">' + s.notes.map(function (t, k) {
        return '<li data-line="' + t.line + '"><span class="pin">' + (k + 1) + '</span><span>' + esc(t.text) + '</span><span class="ln">L' + t.line + '</span></li>';
      }).join('') + '</ol>' : '') +
      (d ? '<div class="dec"><button class="dchip" aria-expanded="false"><code>' + esc(d.id) + '</code><span>' + esc(d.title) + '</span></button><div class="dbody" hidden><dl>' +
        '<dt>chose</dt><dd>' + esc(d.chose) + '</dd><dt>over</dt><dd>' + esc(d.over) + '</dd><dt>because</dt><dd>' + esc(d.because) + '</dd></dl>' +
        '<span class="badges">' + badges(d) + '</span></div></div>' : '');
  }

  function moveToken(i) {
    var c = document.querySelector('.chip[data-i="' + i + '"]'), t = $('#token');
    t.style.width = c.offsetWidth + 'px'; t.style.height = c.offsetHeight + 'px';
    t.style.transform = 'translate(' + c.offsetLeft + 'px,' + c.offsetTop + 'px)';
  }

  function reveal(sc) {
    var f = sc.querySelectorAll('.focus'), top = f[0].offsetTop - 34, bottom = f[f.length - 1].offsetTop + 54;
    sc.scrollTop = Math.min(top, (top + bottom - sc.clientHeight) / 2);
  }

  function go(i) {
    i = Math.max(0, Math.min(S.length - 1, i));
    if (i === cur) return;
    cur = i;
    var s = S[i], pane = $('#editor'), old = pane.lastElementChild;
    if (old) { if (still) pane.removeChild(old); else { old.className = 'ed out'; setTimeout(function () { old.remove(); }, 340); } }
    pane.insertAdjacentHTML('beforeend', '<div class="ed">' + editor(s) + '</div>');
    reveal(pane.lastElementChild.querySelector('.code'));
    $('#story').innerHTML = story(s, i);
    document.querySelectorAll('.chip').forEach(function (c) { c.toggleAttribute('aria-current', +c.dataset.i === i); });
    document.querySelectorAll('.dot').forEach(function (c) { c.classList.toggle('on', +c.dataset.i === i); });
    document.querySelectorAll('.drow').forEach(function (r) { r.classList.toggle('cur', r.dataset.id === s.decision); });
    $('#prev').disabled = i === 0; $('#next').disabled = i === S.length - 1;
    moveToken(i);
    history.replaceState(null, '', '#' + (i + 1));
  }

  function lightLine(n) {
    document.querySelectorAll('.row.hl').forEach(function (r) { r.classList.remove('hl'); });
    if (n) document.querySelectorAll('.ed:not(.out) .row[data-line="' + n + '"]').forEach(function (r) { r.classList.add('hl'); });
  }

  // Static parts: header, path strip, cards, footer.
  document.title = T.title + ' · grasp';
  $('#title').textContent = T.title;
  $('#meta').innerHTML = [T.repo, T.branch, T.date].filter(Boolean).map(esc)
    .concat(T.base ? ['base <code>' + esc(T.base) + '</code> → working tree'] : []).join(' · ');
  $('#risk').className = 'risk ' + T.risk.level;
  $('#risk').innerHTML = '<b>' + esc(T.risk.level) + ' risk</b>' + esc(T.risk.note);
  $('#what').textContent = T.what;
  $('#why').textContent = T.why;
  $('#strip').innerHTML = '<span class="token" id="token"></span>' + S.map(function (s, i) {
    var o = i && S[i - 1].out;
    return (i ? '<span class="arrow"' + (o ? ' title="' + esc(o.label) + '"' : '') + '><span>' + esc(o ? o.label : '') + '</span><i></i></span>' : '') +
      '<button class="chip ' + s.status + '" data-i="' + i + '" title="' + esc(s.file) + ' · ' + STATUS[s.status] + '"><span class="n">' + (i + 1) + '</span>' + esc(s.at) + '</button>';
  }).join('') + '<span class="legend"><span class="new">new</span><span class="changed">changed</span><span class="context">context</span></span>';
  $('#dots').innerHTML = S.map(function (s, i) { return '<button class="dot" data-i="' + i + '" aria-label="Stop ' + (i + 1) + '"></button>'; }).join('');

  var D = T.decisions || [], R = T.risks || [], O = T.offPath || [];
  $('#decisions').innerHTML = '<h3>Decisions <span>· ' + D.length + '</span></h3>' + D.map(function (d) {
    return '<div class="drow" data-id="' + esc(d.id) + '"><code>' + esc(d.id) + '</code><b>' + esc(d.title) + '</b><span>' + esc(d.chose) +
      '</span><span><span class="lbl">over</span>' + esc(d.over) + '</span><span><span class="lbl">because</span>' + esc(d.because) + '</span><span class="badges">' + badges(d) + '</span></div>';
  }).join('');
  $('#risks').innerHTML = '<h3>Risks <span>· ' + R.length + '</span></h3><ul>' + R.map(function (r) {
    return '<li>' + esc(r.text) + '<div>' + (r.covered ? '<span class="tag ok">covered</span><span class="tagtext">' + esc(r.covered) + '</span>' : '') +
      (r.gap ? '<span class="tag gap">gap</span><span class="tagtext">' + esc(r.gap) + '</span>' : '') + '</div></li>';
  }).join('') + '</ul>';
  $('#off').innerHTML = '<h3>Off the path <span>· supporting code, skim only</span></h3><ul>' + O.map(function (o) {
    return '<li><code>' + esc(o.file) + '</code><span class="what">' + esc(o.what) + '</span><span class="stat">' +
      esc(o.stat).replace(/\+\d+/, '<span class="a">$&</span>').replace(/-\d+/, '<span class="d">$&</span>') + '</span></li>';
  }).join('') + '</ul>';
  $('#foot').textContent = 'private file under ~/.grasp, not part of the repo' + (T.words ? ' · ' + T.words + ' words' : '');
  if (!D.length) $('#decisions').remove();
  if (!R.length) $('#risks').remove();
  if (!O.length) $('#off').remove();

  // Navigation: buttons, chips, dots, keys, hash.
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-i],#prev,#next,.rmbtn,.dchip');
    if (!t) return;
    if (t.id === 'prev') go(cur - 1);
    else if (t.id === 'next') go(cur + 1);
    else if (t.dataset.i) go(+t.dataset.i);
    else {
      var box = t.classList.contains('rmbtn') ? t.parentNode.nextElementSibling : t.nextElementSibling;
      box.hidden = !box.hidden;
      t.setAttribute('aria-expanded', !box.hidden);
    }
  });
  addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    var k = { ArrowRight: cur + 1, ArrowLeft: cur - 1, Home: 0, End: S.length - 1 }[e.key];
    if (k === undefined) return;
    e.preventDefault();
    go(k);
  });
  $('#story').addEventListener('mouseover', function (e) { var li = e.target.closest('li[data-line]'); lightLine(li && li.dataset.line); });
  $('#story').addEventListener('mouseleave', function () { lightLine(null); });
  addEventListener('hashchange', function () { go((parseInt(location.hash.slice(1), 10) || 1) - 1); });
  addEventListener('resize', function () { moveToken(cur); });

  go((parseInt(location.hash.slice(1), 10) || 1) - 1);
  $('#token').offsetWidth;
  $('#token').classList.add('ready');
})();
</script>
</body>
</html>
