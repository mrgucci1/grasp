<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>grasp · explain</title>
<!-- grasp-explain renderer. build.mjs puts the tour data in the script#tour placeholder below. This file lives under ~/.grasp, never in the repo. -->
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --ink:#1b1f24; --muted:#5b6470; --rule:#dde1e6;
    --accent:#2f6fde; --code-bg:#f0f2f5;
    --add:#1a7f37; --add-bg:#e6f4ea; --del:#b42318; --del-bg:#fdecea; --hunk:#6e56cf;
    --you:#8a4b00; --you-bg:#fff0d6;
    --low:#1a7f37; --med:#9a6700; --high:#b42318;
    --gut:#8c959f; --lit:#2f6fde0d; --sweep:#2f6fde30; --hl:#2f6fde24; --dim:.42;
    --spot:#2f6fde1f; --mark:#ffd84d80;
    --kw:#cf222e; --str:#0a3069; --num:#0550ae; --com:#6e7781; --fn:#8250df; --ty:#953800;
    --bar:58px; /* height of whatever is pinned at the top: scrolling stops below it */
    --mono:ui-monospace,"Cascadia Code","SF Mono",Consolas,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0f1216; --card:#161a20; --ink:#e6e9ee; --muted:#9aa4b1; --rule:#2a313a;
      --accent:#7aa7ff; --code-bg:#1b2027;
      --add:#56d364; --add-bg:#12261a; --del:#ff7b72; --del-bg:#2d1416; --hunk:#b3a4ff;
      --you:#ffb454; --you-bg:#33240d;
      --low:#56d364; --med:#e3b341; --high:#ff7b72;
      --gut:#6e7681; --lit:#7aa7ff0f; --sweep:#7aa7ff30; --hl:#7aa7ff26; --dim:.4;
      --spot:#7aa7ff22; --mark:#e3b34155;
      --kw:#ff7b72; --str:#a5d6ff; --num:#79c0ff; --com:#8b949e; --fn:#d2a8ff; --ty:#ffa657;
      color-scheme:dark;
    }
  }
  *{box-sizing:border-box}
  html{scroll-padding-top:calc(var(--bar) + 12px)}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:1360px;margin:0 auto;padding:20px 24px 32px}
  code,kbd,.mono,.code,.tabs,.chip,.arrow,.pill,.badge,.eyebrow,h3,.stack,.time,.w.c{font-family:var(--mono);font-variant-ligatures:none}
  button{font:inherit;color:inherit;cursor:pointer}
  .eyebrow,h3{font-size:11px;line-height:1.2;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
  .glow{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px;animation:glow 1.4s ease-in-out infinite alternate}
  @keyframes glow{to{outline-color:color-mix(in srgb,var(--accent) 35%,transparent)}}

  /* player: the voice-over controls, pinned to the top */
  .player{position:sticky;top:0;z-index:30;min-height:58px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px max(16px,calc((100vw - 1360px)/2 + 24px));background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
  .player[hidden]{display:none}
  .play{display:inline-flex;align-items:center;gap:8px;min-width:132px;padding:8px 16px 8px 12px;border:0;border-radius:999px;background:var(--accent);color:var(--card);font-weight:650;font-size:13.5px}
  .play:hover{filter:brightness(1.08)}
  .play.nudge{animation:nudge 1.3s ease-in-out infinite}
  @keyframes nudge{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--accent) 28%,transparent)}}
  .hint.start{margin-top:8px;color:var(--ink)}
  .play svg,.ib svg{width:16px;height:16px;fill:currentColor;flex:none}
  .ib{display:grid;place-items:center;width:34px;height:34px;padding:0;border:1px solid var(--rule);border-radius:9px;background:var(--bg)}
  .ib:hover{border-color:var(--accent);color:var(--accent)}
  .track{flex:1 1 280px;min-width:200px;display:grid;gap:5px}
  .where{display:flex;gap:8px;align-items:baseline;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden}
  .where b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis}
  .where .mv{font:700 10px/1 ui-monospace,Consolas,monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
  .bar{position:relative;height:8px;border-radius:4px;background:var(--rule);cursor:pointer}
  .bar:hover{height:10px;margin:-1px 0}
  .bar .fill{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--accent);pointer-events:none}
  .bar i{position:absolute;top:-2px;bottom:-2px;width:2px;margin-left:-1px;background:var(--card);pointer-events:none}
  .time{min-width:96px;text-align:right;font-size:12px;color:var(--muted)}
  .sel{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .sel select{max-width:190px;font:inherit;font-size:12.5px;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:7px;padding:4px 6px}
  .chk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none}
  .chk input{accent-color:var(--accent);margin:0}

  /* header */
  header{display:grid;gap:4px;margin-bottom:14px}
  .titlerow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
  h1{font-size:22px;line-height:1.25;margin:0;text-wrap:balance}
  .meta{color:var(--muted);font-size:13px;margin:0}
  .meta code{color:var(--ink)}
  .risk{display:inline-flex;align-items:baseline;gap:7px;font-size:12.5px;padding:2px 10px;border-radius:999px;border:1px solid currentColor}
  .risk b{font:700 10.5px/1 ui-monospace,Consolas,monospace;text-transform:uppercase;letter-spacing:.06em}
  .risk.low{color:var(--low)} .risk.med{color:var(--med)} .risk.high{color:var(--high)}
  .ww{display:grid;grid-template-columns:max-content 1fr;gap:2px 14px;margin:8px 0 0}
  .ww dt{font:600 11px/23px ui-monospace,Consolas,monospace;letter-spacing:.08em;color:var(--muted)}
  .ww dd{margin:0;font-size:15px}

  /* path strip: chips coloured by change status, a lit token on the active one */
  .strip{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:6px 0;padding:7px;background:var(--card);border:1px solid var(--rule);border-radius:10px;margin-bottom:14px}
  .token{position:absolute;left:0;top:0;border-radius:7px;background:var(--hl);box-shadow:inset 0 0 0 1.5px var(--accent);pointer-events:none}
  .token.ready{transition:transform .38s cubic-bezier(.3,.7,.2,1),width .38s,height .38s}
  .chip{position:relative;display:inline-flex;align-items:center;gap:7px;padding:5px 10px 5px 6px;border:0;background:none;border-radius:7px;font-size:12.5px;color:var(--muted)}
  .chip.ends{padding:5px 10px;font-weight:600;letter-spacing:.02em}
  .chip:hover,.chip[aria-current]{color:var(--ink)}
  .chip .n{display:grid;place-items:center;min-width:20px;height:20px;border-radius:5px;font-size:11px;font-weight:700;color:var(--st);background:color-mix(in srgb,var(--st) 16%,transparent)}
  .new{--st:var(--add)} .changed{--st:var(--med)} .context{--st:var(--muted)}
  .arrow{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:30px;max-width:180px;padding:0 4px;font-size:10.5px;color:var(--muted)}
  .arrow span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .arrow i{align-self:stretch;position:relative;height:1px;margin-right:4px;background:var(--gut)}
  .arrow i::after{content:"";position:absolute;right:-5px;top:-3.5px;border:4px solid transparent;border-left:6px solid var(--gut);border-right:0}
  .legend{margin-left:auto;display:flex;gap:12px;padding:0 6px;font-size:11.5px;color:var(--muted)}
  .legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:var(--st)}

  /* stage */
  .stage{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
  #editor{background:var(--card);border:1px solid var(--rule);border-radius:10px;overflow:hidden;scroll-margin-top:calc(var(--bar) + 12px)}
  #pane{position:relative;overflow:hidden}
  .ed{animation:in .32s ease-out}
  .ed.into{animation:into .45s cubic-bezier(.3,.7,.2,1)}
  .ed.outof{animation:outof .45s cubic-bezier(.3,.7,.2,1)}
  .ed.out{position:absolute;inset:0 0 auto;animation:out .32s ease-in forwards;pointer-events:none}
  @keyframes in{from{opacity:0}} @keyframes out{to{opacity:0}}
  @keyframes into{from{opacity:0;transform:translate(36px,8px) scale(.975)}}
  @keyframes outof{from{opacity:0;transform:translate(-36px,0) scale(.975)}}
  .stack{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;padding:6px 12px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--rule)}
  .stack b{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-right:2px}
  .stack .fr{padding:1px 7px;border-radius:5px;background:var(--code-bg)}
  .stack .fr.top{color:var(--ink);background:color-mix(in srgb,var(--accent) 15%,transparent);box-shadow:inset 0 0 0 1px var(--accent)}
  .stack .mv{margin-left:auto;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
  .tabs{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;padding-right:10px;background:var(--code-bg);border-bottom:1px solid var(--rule);font-size:12.5px}
  .tab{display:flex;gap:10px;align-items:baseline;padding:7px 14px 8px;margin-bottom:-1px;background:var(--card);border-top:2px solid var(--accent);border-right:1px solid var(--rule);font-weight:600}
  .tab .dir,.tab .range{color:var(--muted);font-weight:400}
  .tabs .open{margin-left:auto;font-size:11.5px;color:var(--accent);text-decoration:none;padding:4px 0}
  .tabs .open:hover{text-decoration:underline}
  .badge{display:inline-block;font-size:10.5px;line-height:1;font-weight:700;padding:4px 7px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em;color:var(--st,var(--muted));background:color-mix(in srgb,var(--st,var(--muted)) 15%,transparent)}
  .badge.you{--st:var(--you);background:var(--you-bg);text-transform:none;letter-spacing:0}
  .badge.lock{--st:var(--accent)} .badge.unconfirmed{--st:var(--del)}

  /* code */
  .code{position:relative;overflow:auto;max-height:max(320px,calc(100vh - 380px));padding:6px 0 10px;font-size:13px;line-height:20px;tab-size:4}
  .lines{width:max-content;min-width:100%}
  .row{display:flex;position:relative;white-space:pre}
  .gut{position:sticky;left:0;z-index:2;flex:none;width:54px;padding-right:16px;text-align:right;color:var(--gut);background:var(--card);user-select:none}
  .src{flex:1;padding-right:28px;transition:opacity .25s}
  .row.dim .src{opacity:var(--dim)}
  .row.focus{background:linear-gradient(90deg,transparent,var(--sweep),transparent) -60% 0/35% 100% no-repeat var(--lit);animation:sweep .7s .12s ease-out both}
  .row.focus .gut{color:var(--ink)}
  .lit{background:var(--lit)}
  .row.focus .gut,.lit .gut{background:linear-gradient(var(--lit),var(--lit)),var(--card);box-shadow:inset 2px 0 var(--accent)}
  @keyframes sweep{from{background-position:-60% 0}to{background-position:160% 0}}
  .row.add .gut::after{content:"";position:absolute;right:6px;top:0;bottom:0;width:3px;background:var(--add)}
  .lines .row.hl{background-color:var(--hl)}
  .lines .row.hl .src{opacity:1}
  .com{color:var(--com);font-style:italic} .str{color:var(--str)} .num{color:var(--num)} .kw{color:var(--kw)} .fn{color:var(--fn)} .ty{color:var(--ty)}
  /* while the voice talks about some lines: those lines light up, the rest fade, named identifiers get a box */
  .lines.speaking .row:not(.spot) .src,.lines.speaking .mk:not(.spot){opacity:.3}
  .lines.speaking .row.spot{background:var(--spot);animation:none}
  .lines.speaking .row.spot .src{opacity:1}
  .lines.speaking .row.spot .gut{color:var(--ink);background:linear-gradient(var(--spot),var(--spot)),var(--card);box-shadow:inset 3px 0 var(--accent)}
  .mk{transition:opacity .25s}
  mark.tok{color:inherit;background:var(--mark);border-radius:3px;box-shadow:0 0 0 1.5px color-mix(in srgb,var(--you) 60%,transparent);animation:tok .5s ease-out}
  @keyframes tok{from{box-shadow:0 0 0 6px color-mix(in srgb,var(--you) 0%,transparent);background:transparent}}

  /* decorations: in/out marker rules, note callouts, removed lines */
  .mk{--mk:var(--gut);display:flex;height:24px}
  .mk.strong{--mk:var(--accent)}
  .mk .rule{flex:1;position:relative;display:flex;align-items:center}
  .mk .rule::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed var(--mk);transform-origin:left;animation:draw .45s ease-out both}
  .mk.strong .rule::before{border-top:2px solid var(--mk);margin-top:-1px}
  @keyframes draw{from{transform:scaleX(0)}}
  .pill{position:sticky;left:62px;z-index:1;display:inline-flex;align-items:baseline;gap:7px;margin-left:8px;padding:0 9px;border-radius:999px;border:1px solid var(--mk);background:var(--card);color:var(--ink);font-size:11.5px;line-height:18px}
  .pill b{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--mk)}
  .mk.strong .pill{background:var(--accent);color:var(--card)}
  .mk.strong .pill b{color:inherit}
  .row.note{white-space:normal}
  .callout{position:sticky;left:62px;display:inline-flex;align-items:center;gap:8px;max-width:min(64ch,calc(100vw - 120px));margin:1px 0 5px 8px;padding:2px 10px 2px 3px;border-radius:6px;background:color-mix(in srgb,var(--accent) 11%,var(--card));font:12.5px/18px system-ui,-apple-system,"Segoe UI",sans-serif}
  .callout::before{content:"";position:absolute;left:8px;top:-5px;border:5px solid transparent;border-bottom-color:color-mix(in srgb,var(--accent) 11%,var(--card));border-top:0}
  .pin{display:grid;place-items:center;flex:none;width:17px;height:17px;border-radius:50%;background:var(--accent);color:var(--card);font:700 10px/1 ui-monospace,Consolas,monospace}
  .row.rm .gut::after{content:"";position:absolute;right:4px;top:6px;border:4px solid transparent;border-left:6px solid var(--del);border-right:0}
  .rmbtn{position:sticky;left:62px;margin-left:4px;padding:0 6px;border:0;border-radius:4px;background:none;color:var(--del);font-size:11.5px}
  .rmbtn:hover{background:var(--del-bg)}
  .rmbtn::after{content:" ▸"} .rmbtn[aria-expanded="true"]::after{content:" ▾"}
  .row.del,.row.del .gut{background:var(--del-bg);color:var(--del)}
  .lines.speaking .row.del.spot .src{opacity:1}

  /* the flow map: shown during the overview and the recap */
  .map{padding:14px 16px 18px}
  .map .eyebrow{margin-bottom:10px}
  .mrow{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:2px 12px;width:calc(100% - var(--d) * 32px);margin-left:calc(var(--d) * 32px);padding:9px 12px;border:1px solid var(--rule);border-radius:9px;background:var(--card);text-align:left;transition:box-shadow .25s,background .25s}
  .mrow:hover{border-color:var(--accent)}
  .mrow .n{grid-row:1/3;display:grid;place-items:center;min-width:24px;height:24px;border-radius:6px;font:700 12px/1 ui-monospace,Consolas,monospace;color:var(--st);background:color-mix(in srgb,var(--st) 16%,transparent)}
  .mrow code{font-weight:600;font-size:13px;overflow-wrap:anywhere}
  .mrow .mt{color:var(--muted);font-size:13px}
  .mrow .mf{grid-column:2;font:11.5px ui-monospace,Consolas,monospace;color:var(--muted);overflow-wrap:anywhere}
  .mrow .badge{grid-column:3;grid-row:1/3}
  .mrow.glow,.mrow[aria-current]{outline:0;animation:none;box-shadow:0 0 0 2px var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--card))}
  .medge{display:flex;align-items:center;gap:8px;margin-left:calc(var(--d) * 32px + 23px);padding:5px 0 5px 14px;border-left:2px dashed var(--rule);font:11.5px ui-monospace,Consolas,monospace;color:var(--muted)}
  .medge .ek{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  .medge .ek.into,.medge .ek.outof{color:var(--accent)}

  /* subtitle bar under the code: the sentence being spoken, word by word */
  .caption{min-height:84px;padding:10px 16px 13px;border-top:1px solid var(--rule);background:color-mix(in srgb,var(--accent) 4%,var(--card))}
  .captag{display:flex;flex-wrap:wrap;gap:4px 10px;margin-bottom:5px;font:600 10.5px/1.4 ui-monospace,Consolas,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .captag .new{color:var(--add)} .captag .changed{color:var(--med)} .captag .old{color:var(--del)}
  .cap{margin:0;font-size:16.5px;line-height:1.55;text-wrap:pretty}
  .cap .w{color:color-mix(in srgb,var(--ink) 45%,transparent);transition:color .12s}
  .cap.idle .w,.cap .w.said,.cap .w.now{color:var(--ink)}
  .cap .w.now{text-decoration:underline 2px var(--accent);text-underline-offset:5px}
  .w.c{font-size:.86em;padding:1px 4px;border-radius:4px;background:var(--code-bg)}
  .w.t{text-decoration:underline dotted 1.5px var(--you);text-underline-offset:4px;cursor:help}
  .cap .w.t.now{text-decoration:underline 2px var(--you)}
  .hint{margin:0;font-size:14px;color:var(--muted)}
  .hint kbd{padding:1px 5px;border:1px solid var(--rule);border-radius:4px;background:var(--bg);color:var(--ink)}

  /* narration side panel */
  .narr{position:sticky;top:calc(var(--bar) + 12px);max-height:calc(100vh - var(--bar) - 24px);overflow:auto;background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:12px 16px 16px;overscroll-behavior:contain}
  .ctl{display:flex;align-items:center;gap:8px;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--rule)}
  .nb{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--rule);border-radius:7px;background:var(--bg);font-size:13px}
  .nb:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .nb:disabled{opacity:.4;cursor:default}
  kbd{font-size:11px;color:var(--muted)}
  .dots{flex:1;display:flex;flex-wrap:wrap;justify-content:center;gap:5px}
  .dot{width:8px;height:8px;padding:0;border:0;border-radius:4px;background:var(--rule);transition:width .3s}
  .dot.ends{background:color-mix(in srgb,var(--muted) 45%,transparent)}
  .dot.on{width:20px;background:var(--accent)}
  .role.entry,.role.exit{color:var(--accent)}
  .narr h2{font-size:18px;line-height:1.3;margin:6px 0 2px}
  .at{font-size:12.5px;color:var(--muted)}
  .say{font-size:15px;line-height:1.55;margin:10px 0 0}
  .defs{display:grid;gap:6px;margin-top:12px}
  .defs:empty{display:none}
  .def{padding:7px 10px 8px;border:1px solid color-mix(in srgb,var(--you) 35%,var(--rule));border-radius:8px;background:var(--you-bg);font-size:13.5px;line-height:1.45;animation:pop .35s ease-out}
  .def b{display:block;margin-bottom:1px;font:700 10.5px/1.4 ui-monospace,Consolas,monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--you)}
  @keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}}
  .txh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:16px}
  .txh span{font-size:11.5px;color:var(--muted)}
  .tx{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:1px;counter-reset:tx}
  .tx li{position:relative;margin:0 -8px;padding:6px 8px 6px 30px;border-radius:7px;font-size:13.5px;line-height:1.5;cursor:pointer;transition:background .2s,color .2s}
  .tx li::before{counter-increment:tx;content:counter(tx);position:absolute;left:8px;top:8px;font:11px/1.4 ui-monospace,Consolas,monospace;color:var(--muted)}
  .tx li:hover{background:var(--hl)}
  .tx li.past{color:var(--muted)}
  .tx li.now{background:color-mix(in srgb,var(--accent) 12%,transparent);box-shadow:inset 3px 0 var(--accent)}
  .tx .ln{float:right;margin-left:8px;font:11px/1.9 ui-monospace,Consolas,monospace;color:var(--muted)}
  .notes{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:2px}
  .notes li{display:flex;align-items:baseline;gap:8px;padding:4px 6px;margin:0 -6px;border-radius:6px;font-size:13.5px;cursor:default}
  .notes li:hover{background:var(--hl)}
  .notes .pin{transform:translateY(3px)}
  .notes .ln{margin-left:auto;font:11px ui-monospace,Consolas,monospace;color:var(--muted)}
  .dec{margin-top:14px;border:1px solid var(--rule);border-radius:8px}
  .dchip{display:flex;width:100%;align-items:baseline;gap:8px;padding:7px 10px;border:0;background:none;text-align:left;font-size:13.5px}
  .dchip code{font-weight:700;color:var(--accent)}
  .dchip::after{content:"▸";margin-left:auto;color:var(--muted)} .dchip[aria-expanded="true"]::after{content:"▾"}
  .dbody{padding:0 10px 10px}
  .dbody dl{display:grid;grid-template-columns:max-content 1fr;gap:3px 12px;margin:0 0 8px;font-size:13.5px}
  .dbody dt{font:11px/20px ui-monospace,Consolas,monospace;color:var(--muted)}
  .dbody dd{margin:0}
  .badges{display:inline-flex;flex-wrap:wrap;gap:4px}

  /* cards */
  .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
  .card{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:12px 16px;scroll-margin-top:calc(var(--bar) + 12px)}
  .card.wide{grid-column:1/-1}
  .card h3 span{font-weight:400;letter-spacing:0;text-transform:none}
  .card ul{list-style:none;margin:8px 0 0;padding:0}
  .card li,.drow{padding:6px 0;border-top:1px solid var(--rule)}
  .card li:first-child,.drow:first-of-type{border-top:0}
  .drow{display:grid;grid-template-columns:30px minmax(0,.8fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.3fr) 240px;gap:12px;align-items:baseline;font-size:13.5px}
  .drow.cur{margin:0 -16px;padding-left:16px;padding-right:16px;background:var(--lit);box-shadow:inset 2px 0 var(--accent)}
  .drow code{font-weight:700;color:var(--accent)}
  .lbl{font:11px ui-monospace,Consolas,monospace;color:var(--muted);margin-right:6px}
  .risks li{font-size:13.5px}
  .tag{display:inline-block;margin:3px 6px 0 0;font:700 10px/1 ui-monospace,Consolas,monospace;text-transform:uppercase;letter-spacing:.05em;padding:3px 6px;border-radius:4px;color:var(--st);background:color-mix(in srgb,var(--st) 15%,transparent)}
  .tag.ok{--st:var(--low)} .tag.gap{--st:var(--med)}
  .tagtext{font-size:12.5px;color:var(--muted);margin-right:12px}
  .off li{display:grid;grid-template-columns:minmax(0,max-content) minmax(0,1fr) max-content;gap:12px;align-items:baseline;font-size:13px}
  .off code{font-size:12.5px;overflow-wrap:anywhere}
  .off .what{color:var(--muted)}
  .stat{font:12px ui-monospace,Consolas,monospace} .stat .a{color:var(--add)} .stat .d{color:var(--del)}
  .terms dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:0 16px;margin:8px 0 0;font-size:13.5px}
  .terms dt,.terms dd{margin:0;padding:6px 0;border-top:1px solid var(--rule)}
  .terms dt:first-of-type,.terms dd:first-of-type{border-top:0}
  .terms dt{font-weight:650;color:var(--you)}
  footer{margin-top:18px;text-align:center;font-size:12px;color:var(--muted)}
  .fab{display:none}

  @media (max-width:900px){
    :root{--bar:0px}
    main{padding:16px}
    /* on a phone the full player scrolls away; a floating button keeps play and pause in reach */
    .player{position:static;padding:8px 16px}
    .fab{position:fixed;right:16px;bottom:16px;z-index:40;display:grid;place-items:center;width:52px;height:52px;padding:0;border:0;border-radius:50%;background:var(--accent);color:var(--card);box-shadow:0 4px 16px rgba(0,0,0,.28)}
    .fab svg{width:20px;height:20px;fill:currentColor}
    .fab[hidden]{display:none}
    .stage,.cards{grid-template-columns:minmax(0,1fr)}
    .narr{position:static;max-height:none}
    .code{max-height:60vh}
    .legend{display:none}
    .drow{grid-template-columns:30px minmax(0,1fr);gap:2px 12px}
    .drow>:nth-child(n+3){grid-column:2}
    .time{min-width:0}
  }

  /* Inside VS Code or Cursor (the grasp extension shows this page in a panel beside the editor). The code is in the real editor
     next door, so this page is the player, the subtitles and the notes, in the editor's own theme. */
  .host{
    --bg:var(--vscode-editor-background); --card:var(--vscode-editorWidget-background,var(--vscode-editor-background)); --ink:var(--vscode-editor-foreground);
    --muted:var(--vscode-descriptionForeground); --rule:var(--vscode-editorWidget-border,var(--vscode-panel-border,#8885));
    --accent:var(--vscode-textLink-foreground); --code-bg:var(--vscode-textCodeBlock-background,var(--vscode-editor-background));
    --add:var(--vscode-gitDecoration-addedResourceForeground,#56d364); --del:var(--vscode-gitDecoration-deletedResourceForeground,#ff7b72);
    --med:var(--vscode-editorWarning-foreground,#e3b341); --low:var(--add); --high:var(--vscode-editorError-foreground,#ff7b72);
    --you:var(--vscode-editorWarning-foreground,#e3b341); --gut:var(--vscode-editorLineNumber-foreground,#888);
    --add-bg:color-mix(in srgb,var(--add) 14%,transparent); --del-bg:color-mix(in srgb,var(--del) 14%,transparent); --you-bg:color-mix(in srgb,var(--you) 12%,var(--card));
    --lit:color-mix(in srgb,var(--accent) 6%,transparent); --hl:color-mix(in srgb,var(--accent) 15%,transparent);
    --spot:color-mix(in srgb,var(--accent) 13%,transparent); --mark:color-mix(in srgb,var(--you) 30%,transparent);
    --mono:var(--vscode-editor-font-family,ui-monospace),monospace;
  }
  .host body.vscode-light,.host body.vscode-high-contrast-light{color-scheme:light}
  .host body.vscode-dark,.host body.vscode-high-contrast:not(.vscode-high-contrast-light){color-scheme:dark}
  .host body{padding:0;font-family:var(--vscode-font-family,system-ui),sans-serif}
  .host :where(code){color:inherit;background:none;padding:0;border-radius:0}
  .host main{max-width:780px;padding:12px 16px 28px}
  .host .dock{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--rule);box-shadow:0 6px 12px -10px rgba(0,0,0,.45)}
  .host .player{position:static;padding:10px 16px 8px;gap:8px 10px;background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none}
  .host .play{min-width:0;background:var(--vscode-button-background,var(--accent));color:var(--vscode-button-foreground,#fff)}
  .host .play:hover{background:var(--vscode-button-hoverBackground,var(--accent));filter:none}
  .host .time{order:1;margin-left:auto;min-width:0}
  .host .track{order:2;flex:1 1 100%;min-width:0}
  .host .sel,.host .chk{order:3}
  .host .sel select{background:var(--vscode-dropdown-background,var(--bg));color:var(--vscode-dropdown-foreground,var(--ink));border-color:var(--vscode-dropdown-border,var(--rule))}
  .host .caption{min-height:0;padding:8px 16px 12px;border-top:1px solid var(--rule);background:color-mix(in srgb,var(--accent) 5%,var(--bg))}
  .host .cap{font-size:15.5px}
  .host #hdefs{margin:0;padding:0 16px 10px;gap:4px;background:color-mix(in srgb,var(--accent) 5%,var(--bg))}
  .host #hdefs .def{padding:4px 10px;font-size:13px}
  .host #hdefs .def b{display:inline;margin-right:8px}
  .host .fab,.host .legend,.host .tabs .open{display:none!important}
  .host .stage,.host .cards{grid-template-columns:minmax(0,1fr)}
  .host .narr{position:static;max-height:none}
  .host h1{font-size:18px}
  .host .tabs::after{content:"lit up in the editor";margin-left:auto;font-size:11.5px;color:var(--muted)}
  /* the editor can't show deleted lines, so they still unfold here when the voice talks about them */
  .host .code{max-height:none;padding:0}
  .host .lines>:not(.gone){display:none}
  .host .gone:not([hidden]){padding:2px 0 8px}
  .host .gone:not([hidden])::before{content:"What these lines replaced";display:block;padding:6px 12px 4px;font:600 10.5px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--del)}
  .host .row.del span{color:inherit}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="player" id="player" hidden>
  <button class="play" id="play" title="Play or pause (Space)"><svg viewBox="0 0 16 16" id="playicon"><path d="M4 2.5v11l9-5.5z"/></svg><span id="playlbl">Play walkthrough</span></button>
  <button class="ib" id="back" title="Previous sentence ( [ )" aria-label="Previous sentence"><svg viewBox="0 0 16 16"><path d="M3 3h2v10H3zM14 3v10L6 8z"/></svg></button>
  <button class="ib" id="fwd" title="Next sentence ( ] )" aria-label="Next sentence"><svg viewBox="0 0 16 16"><path d="M11 3h2v10h-2zM2 3v10l8-5z"/></svg></button>
  <div class="track"><div class="where" id="where"></div><div class="bar" id="bar" role="slider" aria-label="Walkthrough position" tabindex="-1"><div class="fill" id="fill"></div></div></div>
  <span class="time" id="time"></span>
  <label class="sel">Speed <select id="rate"><option value="0.85">0.85×</option><option value="1">1×</option><option value="1.15">1.15×</option><option value="1.3">1.3×</option><option value="1.5">1.5×</option><option value="1.75">1.75×</option></select></label>
  <label class="sel">Voice <select id="voice"></select></label>
  <label class="chk" title="Off: pause at the end of each stop"><input type="checkbox" id="auto" checked>Auto-advance</label>
</div>
<main>
  <header>
    <div class="eyebrow">grasp · explain</div>
    <div class="titlerow"><h1 id="title"></h1><span id="risk" class="risk"></span></div>
    <p class="meta" id="meta"></p>
    <dl class="ww"><dt id="what-dt">WHAT</dt><dd id="what"></dd><dt id="why-dt">WHY</dt><dd id="why"></dd></dl>
  </header>
  <nav class="strip" id="strip" aria-label="Path from entry to exit"></nav>
  <div class="stage">
    <section id="editor" aria-label="Code"><div id="pane"></div><div class="caption" id="caption" aria-live="polite"></div></section>
    <aside class="narr" id="narr">
      <div class="ctl">
        <button class="nb" id="prev" title="Previous stop (←)"><kbd>←</kbd>Prev</button>
        <span class="dots" id="dots"></span>
        <button class="nb" id="next" title="Next stop (→)">Next<kbd>→</kbd></button>
      </div>
      <div id="story"></div>
    </aside>
  </div>
  <div class="cards">
    <section class="card wide" id="decisions"></section>
    <section class="card risks" id="risks"></section>
    <section class="card off" id="off"></section>
    <section class="card wide terms" id="terms"></section>
  </div>
  <footer id="foot"></footer>
</main>
<button class="fab" id="fab" hidden aria-label="Play or pause the walkthrough"><svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg></button>
<script id="tour" type="application/json">__TOUR__</script>
<script>
(() => {
  // Inside VS Code or Cursor, the grasp extension shows this page in a panel beside the real code. The page plays the voice and
  // says which stop and sentence it's on; the extension opens that file and lights up the same lines in the editor.
  const HOST = typeof acquireVsCodeApi === 'function' ? acquireVsCodeApi() : null, BOOT = window.__grasp || {};
  const post = m => { if (HOST) HOST.postMessage(m); };
  if (HOST) document.documentElement.classList.add('host');
  const T = JSON.parse(document.getElementById('tour').textContent);
  const S = T.stops, DEC = {};
  (T.decisions || []).forEach(d => { DEC[d.id] = d; });
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const STATUS = { new: 'NEW', changed: 'CHANGED', context: 'CONTEXT' };
  const store = HOST ? {
    get(k, d) { const v = (BOOT.settings || {})[k]; return v == null ? d : v; },
    set(k, v) { post({ type: 'set', key: k, value: v }); }, // kept by the extension: a panel's own storage doesn't last
  } : {
    get(k, d) { try { const v = localStorage.getItem('grasp.explain.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('grasp.explain.' + k, JSON.stringify(v)); } catch { /* private window */ } },
  };
  const fmt = t => { t = Math.max(0, Math.round(t)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
  const words = s => (String(s).match(/\S+/g) || []).length;
  const span = r => r ? 'L' + r[0] + (r[1] !== r[0] ? '–' + r[1] : '') : '';
  const GAP = 0.3, SCENE_GAP = 0.9;

  // ---- scenes: overview, one per stop, recap -------------------------------------------------
  const scenes = [];
  if (T.intro && T.intro.length) scenes.push({ kind: 'intro', segs: T.intro, name: 'Overview' });
  S.forEach((s, i) => { s.depth = s.depth || 0; scenes.push({ kind: 'stop', i, s, segs: s.walk || [], name: s.at }); });
  if (T.outro && T.outro.length) scenes.push({ kind: 'outro', segs: T.outro, name: 'Recap' });
  const sceneOfStop = i => scenes.findIndex(x => x.i === i);
  const narrated = scenes.some(x => x.segs.length);
  const stepping = S.some(s => s.depth > 0);
  const est = g => g.secs || Math.max(1.5, words(g.spoken || g.say) / 2.6);
  let TOTAL = 0;
  const flat = [];
  scenes.forEach((sc, si) => {
    sc.start = TOTAL;
    sc.segs.forEach((g, k) => { g.t0 = TOTAL; flat.push({ si, k, g }); TOTAL += est(g) + GAP; });
    sc.end = TOTAL; TOTAL += SCENE_GAP;
  });

  // ---- words to know, and narration text split into words for the subtitle -------------------
  const TERMS = (T.terms || []).map((x, i) => Object.assign({ i }, x));
  const termRe = TERMS.length ? new RegExp('(?<![\\p{L}\\p{N}_])(' + TERMS.map(x => x.term).sort((a, b) => b.length - a.length).map(escRe).join('|') + ')(?![\\p{L}\\p{N}_])', 'giu') : null;
  const termOf = m => TERMS.find(x => x.term.toLowerCase() === m.toLowerCase());
  function tokenize(text) {
    let disp = '';
    const code = [];
    String(text).split(/(`[^`]+`)/).forEach(p => {
      const c = p.length > 2 && p[0] === '`' && p[p.length - 1] === '`', s = c ? p.slice(1, -1) : p;
      for (let j = 0; j < s.length; j++) code.push(c);
      disp += s;
    });
    const hits = [];
    if (termRe) { termRe.lastIndex = 0; let m; while ((m = termRe.exec(disp))) if (!code[m.index]) hits.push([m.index, m.index + m[0].length, termOf(m[0])]); }
    // A word ends at a space, or where code meets plain text, so `backoff`, keeps its comma outside the code.
    const out = [];
    let w = 0;
    for (let a = 0, b; a < disp.length; a = b) {
      if (/\s/.test(disp[a])) { b = a + 1; continue; }
      for (b = a + 1; b < disp.length && !/\s/.test(disp[b]) && code[b] === code[a]; b++);
      const hit = hits.find(h => a < h[1] && b > h[0]), c = code[a];
      out.push({ a, b, text: disp.slice(a, b), code: c, term: hit && hit[2], w0: w, w1: (w += (b - a) * (c ? 1.6 : 1) + 1.5) });
    }
    out.forEach(x => { x.f0 = x.w0 / w; x.f1 = x.w1 / w; });
    return { disp, words: out };
  }
  function rich(tok) {
    let html = '', last = 0;
    tok.words.forEach((x, j) => {
      html += esc(tok.disp.slice(last, x.a)) + '<span class="w' + (x.code ? ' c' : '') + (x.term ? ' t' : '') + '" data-w="' + j + '"' +
        (x.term ? ' title="' + esc(x.term.term + ': ' + x.term.def) + '"' : '') + '>' + esc(x.text) + '</span>';
      last = x.b;
    });
    return html + esc(tok.disp.slice(last));
  }
  scenes.forEach(sc => sc.segs.forEach(g => { g.tok = tokenize(g.say); }));

  // ---- tiny editor-style tokenizer: comments, strings, numbers, keywords, calls, types --------
  const KW = {};
  ('abstract and as assert async await break case catch class const continue def default defer del delete do elif else enum except export extends ' +
   'false False final finally fn for from func function go if impl import in instanceof interface is lambda let match mod module mut new nil None ' +
   'not null or package pass private protected pub public raise readonly return self Self static struct super switch this throw throws trait true ' +
   'True try type typeof undefined unless use val var void when where while with yield').split(' ').forEach(k => { KW[k] = 1; });
  const TOKEN = hash => new RegExp((hash ? '(#.*)' : '(\\/\\/.*|\\/\\*.*?(?:\\*\\/|$))') +
    '|("(?:\\\\.|[^"\\\\])*"?|\'(?:\\\\.|[^\'\\\\])*\'?|`(?:\\\\.|[^`\\\\])*`?)|(\\b(?:0x[\\da-fA-F]+|\\d[\\d_]*(?:\\.\\d+)?)\\b)|([A-Za-z_$][\\w$]*)', 'g');
  function paint(line, st) {
    let out = '', last = 0, m;
    const re = st.re;
    if (st.block) {
      const e = line.indexOf('*/');
      if (e < 0) return '<span class="com">' + esc(line) + '</span>';
      out = '<span class="com">' + esc(line.slice(0, e + 2)) + '</span>'; last = e + 2; st.block = false;
    }
    re.lastIndex = last;
    while ((m = re.exec(line))) {
      const t = m[0], cls = m[1] ? 'com' : m[2] ? 'str' : m[3] ? 'num' : KW[t] ? 'kw'
        : /^\s*\(/.test(line.slice(re.lastIndex)) ? 'fn' : /^[A-Z][a-z]/.test(t) ? 'ty' : '';
      if (m[1] && t.slice(0, 2) === '/*' && (t.length < 4 || t.slice(-2) !== '*/')) st.block = true;
      out += esc(line.slice(last, m.index)) + (cls ? '<span class="' + cls + '">' + esc(t) + '</span>' : esc(t));
      last = re.lastIndex;
    }
    return out + esc(line.slice(last));
  }

  // ---- renderers ---------------------------------------------------------------------------------
  const badges = d => (d.locked ? '<span class="badge lock">locked</span>' : '') +
    (d.by === 'agent' || d.by === 'agent-approved' ? '<span class="badge">agent</span>' : '') +
    (d.unconfirmed ? '<span class="badge unconfirmed">unconfirmed</span>' : '');
  const marker = (kind, m, tag, lit) => '<div class="mk ' + kind + (tag ? ' strong' : '') + lit + '" data-line="' + m.line + '"><span class="gut"></span><span class="rule"><span class="pill"><b>' +
    (tag || kind) + '</b>' + esc(m.label) + '</span></span></div>';

  // The call stack at stop i: each earlier stop that is shallower than everything after it.
  function stackOf(i) {
    const out = [S[i]];
    let d = S[i].depth;
    for (let j = i - 1; j >= 0 && d > 0; j--) if (S[j].depth < d) { out.unshift(S[j]); d = S[j].depth; }
    return out;
  }
  function moveOf(i) {
    if (i <= 0) return '';
    const d = S[i].depth - S[i - 1].depth;
    return d > 0 ? 'stepped into' : d < 0 ? 'returned to' : '';
  }

  function editor(s, i) {
    const a = s.lines[0], b = s.lines[1], fa = s.focus[0], fb = s.focus[1], added = {}, removed = {};
    const st = { block: false, re: TOKEN(/\.(py|rb|sh|ya?ml|toml|r|pl|ps1|exs?)$|(^|\/)(Dockerfile|Makefile)$/i.test(s.file)) };
    (s.added || []).forEach(k => { added[k] = 1; });
    (s.removed || []).forEach(r => { removed[r.before] = r.lines; });
    let rows = '';
    for (let n = a; n <= b + 1; n++) {
      // Decoration rows between two focus lines stay lit: above line n when n > fa, below it when n < fb.
      const gone = removed[n], pre = n > fa && n <= fb ? ' lit' : '', post = n >= fa && n < fb ? ' lit' : '';
      if (gone) rows += '<div class="row rm' + pre + '" data-line="' + n + '" data-rm="' + n + '"><span class="gut"></span><button class="rmbtn" aria-expanded="false">− ' + gone.length + ' line' + (gone.length > 1 ? 's' : '') +
        ' removed</button></div><div class="gone" hidden>' + gone.map(l => '<div class="row del" data-line="' + n + '"><span class="gut">−</span><span class="src">' + (esc(l) || ' ') + '</span></div>').join('') + '</div>';
      if (n > b) break;
      if (s.in && s.in.line === n) rows += marker('in', s.in, s.role === 'entry' && 'entry', pre);
      rows += '<div class="row' + (added[n] ? ' add' : '') + (n >= fa && n <= fb ? ' focus' : ' dim') + '" data-line="' + n + '"><span class="gut">' + n +
        '</span><span class="src">' + (paint(s.code[n - a] || '', st) || ' ') + '</span></div>';
      (s.notes || []).forEach((t, k) => {
        if (t.line === n) rows += '<div class="row note' + post + '" data-line="' + n + '"><span class="gut"></span><span class="callout"><span class="pin">' + (k + 1) + '</span>' + esc(t.text) + '</span></div>';
      });
      if (s.out && s.out.line === n) rows += marker('out', s.out, s.role === 'exit' && 'exit', post);
    }
    const dir = s.file.replace(/[^\/]*$/, ''), stack = stackOf(i), mv = moveOf(i);
    return (stepping ? '<div class="stack"><b>call stack</b>' + stack.map((x, k) => (k ? '<span>›</span>' : '') + '<span class="fr' + (k === stack.length - 1 ? ' top' : '') + '">' + esc(x.at) + '</span>').join('') +
        (mv ? '<span class="mv">' + (mv === 'stepped into' ? '↘ ' : '↖ ') + mv + '</span>' : '') + '</div>' : '') +
      '<div class="tabs"><span class="tab"><span><span class="dir">' + esc(dir) + '</span>' + esc(s.file.slice(dir.length)) + '</span><span class="range">' + a + '–' + b + '</span></span>' +
      '<span class="badge ' + s.status + '">' + STATUS[s.status] + '</span>' +
      (s.yours ? '<span class="badge you">you wrote this · ' + esc(s.yours) + '</span>' : '') +
      (s.open ? '<a class="open" href="' + esc(s.open) + '">Open in editor ↗</a>' : '') +
      '</div><div class="code"><div class="lines">' + rows + '</div></div>';
  }

  function map(sc) {
    return '<div class="map"><div class="eyebrow">' + (sc.kind === 'intro' ? 'The path through the change, in the order it runs' : 'The path you just walked') + '</div>' + S.map((s, i) => {
      let edge = '';

    const els = (SHOW[key] || []).map(s => $(s)).filter(Boolean);
    els.forEach(e => e.classList.add('glow'));
    if (els[0] && key !== 'flow') follow(els[els.length - 1]);
  }
  function clearGlow() { $$('.glow').forEach(e => e.classList.remove('glow')); }
  // While playing, the page scrolls to whatever the voice is talking about.
  function follow(el) {
    if (!playing || !el) return;
    const p = HOST ? $('.dock') : $('#player'), r = el.getBoundingClientRect(), top = (getComputedStyle(p).position === 'sticky' ? p.offsetHeight : 0) + 8;
    if (r.top < top || r.top > innerHeight - 120) el.scrollIntoView({ block: r.height > innerHeight - top ? 'start' : 'center', behavior: still ? 'auto' : 'smooth' });
  }
  function define(t) {
    if (shown.has(t.i)) return;
    shown.add(t.i);
    const box = $('#hdefs') || $('#defs');
    if (!box) return;
    box.insertAdjacentHTML('afterbegin', '<div class="def"><b>' + esc(t.term) + '</b>' + esc(t.def) + '</div>');
    while (box.children.length > (HOST ? 2 : 3)) box.lastElementChild.remove();
  }
  function karaoke(f) {
    const g = seg();
    if (!g) return;
    g.tok.words.forEach((x, j) => {
      const el = capWords[j];
      if (!el) return;
      const said = x.f1 <= f, now = !said && x.f0 <= f;
      el.classList.toggle('said', said); el.classList.toggle('now', now);
      if ((said || now) && x.term) define(x.term);
    });
    progress(g.t0 + Math.min(1, f) * est(g));
  }
  function progress(t) {
    $('#fill').style.width = (100 * Math.min(1, t / TOTAL)) + '%';
    $('#time').textContent = fmt(t) + ' / ' + fmt(TOTAL);
  }

  function speakNow() {
    clearTimeout(timer);
    if (handle) { handle.stop(); handle = null; }
    const g = seg();
    if (!g) return;
    const p = $('.cap'); if (p) p.classList.remove('idle');
    handle = voice(g, karaoke, () => { handle = null; advance(); });
    const n = upcoming();
    if (n && mode === 'natural') fetchAhead(n.audio);
  }
  function upcoming() { const sc = scenes[cur]; return sc.segs[segK + 1] || (scenes[cur + 1] && scenes[cur + 1].segs[0]); }
  function advance() {
    if (!playing) return;
    let si = cur, k = segK + 1, gap = GAP;
    if (k >= scenes[si].segs.length) {
      if (si + 1 >= scenes.length) return finish();
      if (!auto) { sceneDone = true; pause(); $('#caption').insertAdjacentHTML('beforeend', '<p class="hint" style="margin-top:6px">End of this stop. Press <b>Play</b> or <kbd>→</kbd> for the next one.</p>'); return; }
      si++; k = 0; gap = SCENE_GAP;
    }
    cue(si, k);
    timer = setTimeout(speakNow, gap * 1000 / rate);
  }
  function finish() {
    playing = false; finished = true; handle = null; button();
    progress(TOTAL);
    $('#caption').insertAdjacentHTML('beforeend', '<p class="hint" style="margin-top:8px"><b>That\'s the whole walkthrough.</b> Back in your terminal, pick <b>Quiz me</b>, ask a question, or call it done. Press Play to hear it again.</p>');
  }
  function play() {
    if (!narrated) return;
    if (finished) { finished = false; cue(0, 0); }
    else if (sceneDone && cur + 1 < scenes.length) cue(cur + 1, 0);
    else if (!cued) cue(Math.max(0, cur), segK);
    playing = true; button();
    $('#play').classList.remove('nudge');
    if (handle && handle.resume) handle.resume(); else speakNow();
  }
  function pause() { playing = false; clearTimeout(timer); if (handle) handle.pause(); button(); }
  const toggle = () => (playing ? pause() : play());
  // → (and the editor's Next Stop): at the end of a stop with auto-advance off, carry on; otherwise go to the next stop.
  const onward = () => (sceneDone ? play() : goScene(cur + 1));
  // The editor or browser refused sound because nothing in the page was clicked or pressed yet. One key press fixes it.
  function blocked() {
    playing = false; handle = null; button();
    $('#play').classList.add('nudge');
    const c = $('#caption');
    if (!c.querySelector('.start')) c.insertAdjacentHTML('beforeend', '<p class="hint start">Press <kbd>Space</kbd> or click <b>Play</b> to start. ' +
      (HOST ? 'The editor lets this panel talk only after a key press or click in it.' : 'The browser lets the page talk only after a key press or click.') + '</p>');
    post({ type: 'blocked' });
  }
  function stopVoice() { clearTimeout(timer); if (handle) { handle.stop(); handle = null; } }
  function jump(si, k) { stopVoice(); cue(si, k); if (playing) speakNow(); else { const p = $('.cap'); if (p) p.classList.add('idle'); } }
  function goScene(si) { si = Math.max(0, Math.min(scenes.length - 1, si)); if (si === cur && !playing) return; jump(si, 0); }
  function stepSeg(d) {
    let si = cur, k = segK + d;
    if (k < 0) { if (si === 0) k = 0; else { si--; k = scenes[si].segs.length - 1; } }
    else if (k >= scenes[si].segs.length) { if (si + 1 < scenes.length) { si++; k = 0; } else k = scenes[si].segs.length - 1; }
    jump(si, Math.max(0, k));
  }
  function button() {
    $('#playlbl').textContent = playing ? 'Pause' : finished ? 'Replay' : handle || cur > 0 || segK > 0 ? 'Resume' : 'Play walkthrough';
    $('#playicon').innerHTML = $('#fab svg').innerHTML = playing ? '<path d="M4 2.5h3v11H4zM9 2.5h3v11H9z"/>' : '<path d="M4 2.5v11l9-5.5z"/>';
    tell();
  }
  function moveToken(si) {
    const c = $('.chip[data-sc="' + si + '"]'), t = $('#token');
    if (!c) return;
    t.style.width = c.offsetWidth + 'px'; t.style.height = c.offsetHeight + 'px';
    t.style.transform = 'translate(' + c.offsetLeft + 'px,' + c.offsetTop + 'px)';
  }
  function lightLine(n) {
    $$('.row.hl').forEach(r => r.classList.remove('hl'));
    if (n) $$('.ed:not(.out) .row[data-line="' + n + '"]').forEach(r => r.classList.add('hl'));
  }

  // ---- wiring ------------------------------------------------------------------------------------------
  if (narrated) {
    $('#player').hidden = false;
    $('#fab').hidden = false;
    $('#bar').innerHTML = '<div class="fill" id="fill"></div>' + scenes.slice(1).map(sc => '<i style="left:' + (100 * sc.start / TOTAL) + '%"></i>').join('');
    $('#bar').title = scenes.map(sc => fmt(sc.start) + '  ' + (sc.kind === 'stop' ? (sc.i + 1) + '. ' + sc.s.at : sc.name)).join('\n');
    fillVoices();
    $('#rate').value = String(rate);
    if ($('#rate').selectedIndex < 0) { rate = 1; $('#rate').value = '1'; }
    $('#auto').checked = auto;
  }
  $('#play').addEventListener('click', toggle);
  $('#fab').addEventListener('click', toggle);
  $('#back').addEventListener('click', () => stepSeg(-1));
  $('#fwd').addEventListener('click', () => stepSeg(1));
  $('#bar').addEventListener('click', e => {
    const r = e.currentTarget.getBoundingClientRect(), t = (e.clientX - r.left) / r.width * TOTAL;
    let pick = flat[0];
    flat.forEach(x => { if (x.g.t0 <= t) pick = x; });
    jump(pick.si, pick.k);
  });
  $('#rate').addEventListener('change', e => { const r = +e.target.value; if (handle && handle.rate) handle.rate(r); rate = r; store.set('rate', r); });
  $('#voice').addEventListener('change', e => { mode = e.target.value; store.set('voice', mode); if (handle) { const was = playing; stopVoice(); if (was) speakNow(); } });
  $('#auto').addEventListener('change', e => { auto = e.target.checked; store.set('auto', auto); });
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-sc],#prev,#next,.rmbtn,.dchip,.tx li');
    if (!t) return;
    if (t.id === 'prev') goScene(cur - 1);
    else if (t.id === 'next') goScene(cur + 1);
    else if (t.dataset.sc) goScene(+t.dataset.sc);
    else if (t.matches('.tx li')) { jump(cur, +t.dataset.k); if (!playing) play(); }
    else {
      const box = t.classList.contains('rmbtn') ? t.parentNode.nextElementSibling : t.nextElementSibling;
      box.hidden = !box.hidden;
      t.setAttribute('aria-expanded', !box.hidden);
    }
  });
  addEventListener('keydown', e => {
    if (e.altKey || e.ctrlKey || e.metaKey || e.target.matches('input,select,textarea')) return;
    if ((e.key === ' ' || e.key === 'k') && narrated) { if (e.target.matches('button') && e.key === ' ') return; e.preventDefault(); toggle(); return; }
    if (e.key === '[' || e.key === ']') { e.preventDefault(); stepSeg(e.key === ']' ? 1 : -1); return; }
    if (e.shiftKey) return;
    const k = { ArrowRight: cur + 1, ArrowLeft: cur - 1, Home: 0, End: scenes.length - 1 }[e.key];
    if (k === undefined) return;
    e.preventDefault();
    if (e.key === 'ArrowRight') onward(); else goScene(k);
  });
  $('#story').addEventListener('mouseover', e => { const li = e.target.closest('.notes li[data-line]'); lightLine(li && li.dataset.line); });
  $('#story').addEventListener('mouseleave', () => lightLine(null));
  addEventListener('hashchange', () => { const si = fromHash(); if (si !== cur) goScene(si); });
  addEventListener('resize', () => moveToken(cur));
  addEventListener('pagehide', () => { if (hasSpeech) speechSynthesis.cancel(); });
  if (HOST) {
    // Player, subtitle and definitions stay pinned at the top of the panel; the editor's status bar and commands drive it too.
    const dock = document.createElement('div');
    dock.className = 'dock';
    dock.append($('#player'), $('#caption'));
    dock.insertAdjacentHTML('beforeend', '<div class="defs" id="hdefs"></div>');
    document.body.prepend(dock);
    let pinned = 0; // the dock is what's pinned at the top here, so --bar is its height (set only when it changes)
    new ResizeObserver(() => { if (dock.offsetHeight !== pinned) document.documentElement.style.setProperty('--bar', (pinned = dock.offsetHeight) + 'px'); }).observe(dock);
    const COMMANDS = { toggle, next: onward, prev: () => goScene(cur - 1), fwd: () => stepSeg(1), back: () => stepSeg(-1) };
    addEventListener('message', e => { const m = e.data || {}; if (m.type === 'cmd' && COMMANDS[m.cmd]) COMMANDS[m.cmd](); });
  }

  function fromHash() {
    const h = location.hash.slice(1);
    if (h === 'intro') return 0;
    if (h === 'recap') return scenes.length - 1;
    const n = parseInt(h, 10);
    return n >= 1 && n <= S.length ? sceneOfStop(n - 1) : 0;
  }
  show(fromHash());
  $('#caption').innerHTML = hint();
  if (narrated) { progress(scenes[cur].start); button(); }
  else $('#caption').hidden = true;
  $('#token').offsetWidth;
  $('#token').classList.add('ready');
  // In the editor: the extension shows stop 1's code, then starts the walkthrough (the grasp.autoplay setting).
  post({ type: 'ready' });
})();
</script>
</body>
</html>
